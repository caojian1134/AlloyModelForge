name: Commensurate FCC standard rectangular cell
random_seed: 43
box:
  lengths: [14.4, 18.0, 21.6]
  periodic: [true, true, true]
phases:
  - name: FCC
    structure: fcc
    lattice_parameter: 3.6
    fraction: 1.0
    composition: {Ni: 1.0}
grains:
  number: 1
  orientations: identity
analysis:
  ovito_enabled: true
  methods: [cna, ptm]
  rdf_enabled: true
output:
  formats: [extxyz, lammps-data, vasp, cif]
